# Standalone workspace for the SONiC Redis pipeline state tracker.
#
# Dependency versions and lint rules are pinned here so the crates build with
# only crates.io dependencies.

[workspace]
resolver = "2"
members = [
    "checker",
    "core",
    "loader",
    "perfetto",
    "pipeline_manager",
    "replay",
    "service",
]

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.98.1"

# Dependencies with versions specified in one place
[workspace.dependencies]
# Internal
config_analyzer_core = { path = "core" }
config_analyzer_loader = { path = "loader" }
config_analyzer_perfetto = { path = "perfetto" }
config_analyzer_pipeline_manager = { path = "pipeline_manager" }
# External
anyhow = "=1.0.104"
clap = { features = ["derive"], version = "=4.6.7" }
rstest = { default-features = false, features = ["async-timeout"], version = "=0.27.0" }
serde = { features = ["derive"], version = "=1.0.229" }
serde-saphyr = "=0.0.29"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { features = ["macros", "rt-multi-thread", "signal", "sync", "time"], version = "=1.53.1" }
yang3 = "=0.19.0"

[workspace.lints.rust]
aarch64-softfloat-neon = "deny"
absolute-paths-not-starting-with-crate = "deny"
